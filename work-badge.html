
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>学生会工作证 · CUHK(SZ)</title>
  <style>
    /* ========== 设计变量（与 2025 仓库保持一致） ========== */
    :root{
      --border: #000;
      --border2: #000;
      --panel: #ffffff;
      --bg-top: #FFF4CC;
      --bg-bottom: #BFA8FF;
      --purple: #A78BFA;
    }
    *{box-sizing:border-box}
    html,body{height:100%}

    body{
      margin:0; display:grid; place-items:center; min-height:100svh;
      background:url("图层 1.png") no-repeat center/cover;
      background-image: url("图层 1.png"), linear-gradient(180deg,#FFF4CC 0%,#e7d8f3 50%,#BFA8FF 100%);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      overflow-x:hidden; overflow-y:auto;
    }

    /* ========== 舞台缩放 ========== */
    .stage{
      position:relative; transform:scale(var(--scale,1)); transform-origin:top center;
      width:max-content; height:max-content;
    }
    .wrap{ position:relative; }
    .badge-wrap{ position:relative; padding-top:110px; }

    /* ========== 证件卡外观 ========== */
    .badge{
      position:relative; z-index:1; width:360px; border-radius:24px;
      background: linear-gradient(
        to bottom,
        #f2e6b9 0%,
        #e7d8f3 45%,
        #c7b5ff 100%
      );
      display:flex; flex-direction:column;
    }
    .badge::before{ /* 外层粗黑边 */
      content:""; position:absolute; inset:0; border-radius:24px;
      box-shadow:0 0 0 8px var(--border2) inset; pointer-events:none; z-index:3;
    }
    .badge::after{ /* 内层细黑边 */
      content:""; position:absolute; inset:14px; border-radius:18px;
      box-shadow:0 0 0 4px var(--border) inset; pointer-events:none; z-index:3;
    }
    .content{ position:relative; z-index:1; display:flex; flex-direction:column; }

    /* ========== 标题 ========== */
    .title{
      text-align:center; font-size:32px; font-weight:800; letter-spacing:2px;
      margin:12px 0 0; position:relative; z-index:2;
    }
    .subtitle{
      text-align:center; font-size:13px; color:#555; margin-bottom:4px;
      position:relative; z-index:2;
    }

    /* ========== 进度条 ========== */
    .progress-wrap{
      margin:8px 28px 0; height:6px; background:rgba(0,0,0,.08);
      border-radius:3px; overflow:hidden; position:relative; z-index:2;
    }
    .progress-fill{
      height:100%; background:#111; border-radius:3px;
      transition:width .3s ease;
    }

    /* ========== 通用面板 ========== */
    .panel{
      margin:18px 28px 0; background:var(--panel); border-radius:18px;
      box-shadow: inset 0 0 0 4px var(--border);
      padding:18px 18px 20px; position:relative; z-index:2;
    }

    /* Quiz 卡片固定高度，防止切题时跳动 */
    #quizCard{ min-height:720px; }
    #quizCard .panel{ min-height:420px; }

    /* ========== 题目 ========== */
    .q-text{ font-size:15px; font-weight:700; margin:0 0 12px; line-height:1.5; text-align:center; }

    /* ========== 选项卡片 ========== */
    .options{ display:grid; gap:8px; }
    .opt{
      display:flex; align-items:flex-start; gap:10px;
      padding:11px 14px; border:2.5px solid #ccc; border-radius:12px;
      cursor:pointer; transition:all .15s ease;
      background:#fafafa; font-size:14px; line-height:1.4;
    }
    .opt:hover{ border-color:#888; }
    .opt.selected{ border-color:#111; background:#f5f0ff; }
    .opt-letter{
      flex:0 0 28px; width:28px; height:28px; border-radius:50%;
      border:2.5px solid #ccc; display:flex; align-items:center; justify-content:center;
      font-weight:800; font-size:13px; color:#888; transition:all .15s ease;
    }
    .opt.selected .opt-letter{ border-color:#111; background:#111; color:#fff; }
    .opt-label{ flex:1; font-weight:600; color:#333; }

    /* ========== 按钮 ========== */
    .btn-row{
      margin:18px 28px 24px; position:relative; z-index:2;
      display:flex; gap:12px;
    }
    .btn-row .btn{ flex:1; }
    .btn{
      width:100%; height:44px; border-radius:999px; border:4px solid #000;
      background:#111; color:#fff; font-size:18px; font-weight:800;
      letter-spacing:2px; cursor:pointer; font-family:inherit;
    }
    .btn:active{ transform:translateY(1px); }
    .btn:disabled{ opacity:.35; cursor:not-allowed; }
    .btn-outline{
      background:#fff; color:#111;
      border:3px solid #000;
    }

    /* 按钮组 */
    .btn-group{ display:flex; gap:10px; }
    .btn-group .btn{ flex:1; font-size:16px; letter-spacing:1px; }
    .btn-group .btn.btn-outline{ flex:0.6; }

    /* ========== 部门卡片 ========== */
    .dept-card{
      margin:18px 28px; background:#fff; border-radius:18px;
      box-shadow: inset 0 0 0 4px var(--border);
      padding:22px 20px; text-align:center; position:relative; z-index:2;
    }
    .dept-icon{ font-size:48px; margin-bottom:6px; }
    .dept-name{ font-size:28px; font-weight:800; letter-spacing:1px; margin-bottom:6px; }
    .dept-desc{ font-size:14px; color:#555; line-height:1.6; }

    /* ========== 表单 ========== */
    .form{ display:grid; gap:18px; position:relative; z-index:2; }
    .row{ display:flex; align-items:center; gap:12px; white-space:nowrap; }
    .row strong{ flex:0 0 4em; font-size:18px; }
    .field{ flex:1; position:relative; height:34px; display:flex; align-items:flex-end; }
    .field::after{ content:""; position:absolute; left:0; right:8px; bottom:0; height:2px; background:#111; }
    .input{
      width:100%; border:none; outline:none; background:transparent;
      font-size:18px; padding:0 6px 2px; line-height:1; font-weight:600; font-family:inherit;
    }
    .input::placeholder{ color:#777; font-weight:500; }

    /* ========== 照片预览 ========== */
    .preview{ display:flex; align-items:center; justify-content:center; gap:12px; }
    .preview .box{
      width:100px; aspect-ratio:3/4; background:#fff; border-radius:12px;
      box-shadow: inset 0 0 0 3px var(--border); overflow:hidden;
      display:flex; align-items:center; justify-content:center; cursor:pointer;
    }
    .preview .box img{ width:100%; height:100%; object-fit:cover; display:block; }
    .preview .tip{ font-size:12px; color:#333; text-align:center; line-height:1.5; }
    .hidden{ display:none !important; }

    /* ========== 工作证 ========== */
    .strap{
      position:absolute; left:50%; top:0; transform:translateX(-50%);
      width:80px; height:120px; background:#B69CFF; border-radius:6px;
    }
    .strap-notch{
      position:absolute; left:50%; top:96px; transform:translateX(-50%);
      width:110px; height:50px; background:#fff; border-radius:12px;
      box-shadow: inset 0 0 0 6px var(--border); z-index:2;
    }
    .top{ position:relative; padding:24px 28px 14px; z-index:2; }
    .logo-line{ display:flex; align-items:center; gap:10px; }
    .logo-img{ width:200px; height:auto; display:block; }

    .info-row{ display:flex; gap:16px; margin-top:18px; align-items:stretch; }
    .avatar{
      flex:0 0 100px; aspect-ratio:3/4; background:#fff; border-radius:16px;
      box-shadow: inset 0 0 0 4px var(--border); padding:8px; display:flex; align-items:stretch;
    }
    .avatar img{ width:100%; height:100%; object-fit:cover; display:block; border-radius:12px; }

    .fields{
      flex:1; background:#fff; border-radius:16px;
      box-shadow: inset 0 0 0 4px var(--border);
      padding:16px 18px; display:grid; gap:14px;
      grid-template-rows: 1fr 1fr; min-width:0; overflow:hidden;
    }
    .line{ display:flex; gap:10px; align-items:center; font-size:16px; white-space:nowrap; }
    .line strong{ flex:0 0 2.5em; }
    .value{ flex:1; position:relative; min-height:26px; display:flex; align-items:center; }
    .value::after{ content:""; position:absolute; left:0; right:6px; bottom:0; height:2px; background:#111; }
    .val-text{ position:relative; z-index:1; padding:0 6px; font-weight:600; display:inline-block; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

    /* ========== 操作按钮 ========== */
    .action-row{
      display:flex; gap:10px; margin:0 auto; width:360px; margin-top:14px;
    }
    .btn-sm{
      height:42px; border-radius:999px; font-size:15px; font-weight:700;
      cursor:pointer; font-family:inherit; letter-spacing:1px;
    }
    .btn-back{ flex:1; background:#fff; color:#111; border:3px solid #000; }
    .btn-dl{ flex:2; background:#111; color:#fff; border:4px solid #000; }
    .btn-sm:active{ transform:translateY(1px); }

    /* ========== 二维码 ========== */
    .qr-wrap{
      display:flex; flex-direction:column; align-items:center; margin-top:14px; gap:6px;
    }
    .qr-img{
      width:120px; height:120px; border-radius:12px;
      border:3px solid #000; background:#fff; object-fit:contain;
    }
    .qr-label{ font-size:13px; font-weight:700; color:#333; }

    /* ========== Toast ========== */
    .toast{
      position:fixed; top:20px; left:50%;
      transform:translateX(-50%) translateY(-120px);
      background:#111; color:#fff; padding:10px 22px; border-radius:999px;
      border:3px solid #000; font-size:14px; font-weight:700;
      z-index:999; opacity:0;
      transition:all .35s cubic-bezier(.16,1,.3,1);
      pointer-events:none; white-space:nowrap;
    }
    .toast.show{ transform:translateX(-50%) translateY(0); opacity:1; }

    /* ========== 页面切换 ========== */
    .page{ display:none; }
    .page.active{ display:block; }

    /* ========== 响应式 ========== */
    @media (max-width:420px) and (orientation: landscape){
      .badge{ width:320px; }
      .row strong{ flex-basis:3.5em; font-size:16px; }
      .field{ height:30px; }
      .input{ font-size:16px; }
      .btn{ height:42px; font-size:16px; }
    }
  </style>
</head>
<body>
  <div class="toast" id="toast"></div>

  <!-- ==================== 第1页：排序测试 ==================== -->
  <div class="page active" id="quizPage">
    <div class="stage"><div class="wrap scene">
      <div class="badge" id="quizCard">
        <div class="content">
          <div class="title">新生趣味测试</div>
          <div class="subtitle" id="quizProgress">第 1 / 5 题</div>
          <div class="progress-wrap"><div class="progress-fill" id="progressBar" style="width:0%"></div></div>
          <div class="panel">
            <div class="q-text" id="qText"></div>
            <div class="options" id="optionsList"></div>
          </div>
          <div class="btn-row">
            <button class="btn btn-outline" id="prevBtn" onclick="prevQuestion()">← 上一题</button>
            <button class="btn" id="nextBtn" disabled onclick="nextQuestion()">下一题</button>
          </div>
        </div>
      </div>
    </div></div>
  </div>

  <!-- ==================== 第2页：匹配结果 + 信息输入 ==================== -->
  <div class="page" id="resultPage">
    <div class="stage"><div class="wrap scene">
      <div class="badge">
        <div class="content">
          <div class="title">你的匹配部门</div>
          <div class="dept-card">
            <div class="dept-icon" id="deptIcon"></div>
            <div class="dept-name" id="deptName"></div>
            <div class="dept-desc" id="deptDesc"></div>
          </div>
          <div class="panel">
            <div class="form" autocomplete="off">
              <div class="row">
                <strong>姓名</strong>
                <div class="field">
                  <input class="input" type="text" id="nameInput" placeholder="（未填写）" maxlength="12" />
                </div>
              </div>
              <div class="row">
                <strong>照片</strong>
                <div style="flex:1;display:flex;gap:12px;align-items:center;">
                  <div class="preview" style="justify-content:flex-start;">
                    <div class="box" onclick="document.getElementById('photoInput').click()">
                      <img id="photoPreview" alt="预览" />
                    </div>
                  </div>
                  <div class="preview .tip" style="flex:1;">点击照片框<br/>上传图片</div>
                </div>
                <input type="file" id="photoInput" accept="image/*" class="hidden" />
              </div>
            </div>
          </div>
          <div class="btn-row">
            <div class="btn-group">
              <button class="btn btn-outline" onclick="goToQuiz()">← 重做</button>
              <button class="btn" onclick="generateBadge()">生成工作证</button>
            </div>
          </div>
        </div>
      </div>
    </div></div>
  </div>

  <!-- ==================== 第3页：工作证 ==================== -->
  <div class="page" id="badgePage">
    <div class="stage"><div class="badge-wrap scene">
      <div class="strap" aria-hidden="true"></div>
      <div class="strap-notch" aria-hidden="true"></div>
      <main class="badge" id="badgeCard" role="group" aria-label="学生会工作证">
        <section class="top">
          <div class="logo-line" aria-label="学校标识">
            <img src="CUHK-Shenzhen.png" alt="香港中文大学（深圳）" class="logo-img" />
          </div>
          <h1 class="title">学生会工作证</h1>
          <div class="info-row" aria-label="基本信息">
            <div class="avatar" aria-hidden="true">
              <img id="badgePhoto" alt="头像" />
            </div>
            <div class="fields">
              <div class="line"><strong>姓名</strong><div class="value"><span id="badgeName" class="val-text"></span></div></div>
              <div class="line"><strong>部门</strong><div class="value"><span id="badgeDept" class="val-text"></span></div></div>
            </div>
          </div>
        </section>
        <section class="panel" aria-label="学生会公众号" style="margin:24px 28px 32px; text-align:center; padding:18px 18px 24px;">
          <h3 style="margin:0 0 12px; font-size:18px; font-weight:800; letter-spacing:1px;">关注学生会公众号</h3>
          <img class="qr-img" id="qrCode" src="qrcode.jpg" alt="学生会公众号二维码"
               onerror="this.style.display='none'" style="margin:0 auto;" />
        </section>
      </main>
    </div></div>

    <div class="action-row">
      <button class="btn-sm btn-back" onclick="goToResult()">← 返回修改</button>
      <button class="btn-sm btn-dl" onclick="downloadBadge()">↓ 保存工作证</button>
    </div>
  </div>

  <script>
    /* ========== 部门映射 ========== */
    var DEPT_MAP = {
      A: { name: '文宣部',   icon: '🎨', desc: '活动海报设计、推送制作、视频拍摄剪辑' },
      B: { name: '外联部',   icon: '🤝', desc: '校际交流、拉赞助、外联福利周' },
      C: { name: '学术部',   icon: '📚', desc: 'Mentor项目、学长学姐经验茶话夜' },
      D: { name: '活动部',   icon: '🎉', desc: '新生舞会、中秋晚会、读书周' },
      E: { name: '权益部',   icon: '🛡️', desc: '春节大巴、食堂检查、权益信箱' },
      F: { name: '社团联合部', icon: '🏛️', desc: '百团大战、社团文化节' }
    };

    /* ========== 5 道题目 ========== */
    var QUESTIONS = [
      {
        text: '迎新周期间，你更愿意承担哪项工作？',
        options: [
          { key:'A', label:'拍摄Vlog、设计迎新海报和推送' },
          { key:'B', label:'接待来访的外校嘉宾，引导参观' },
          { key:'C', label:'组织新生学术导览讲座，介绍选课经验' },
          { key:'D', label:'布置舞台音响，把控现场流程' },
          { key:'E', label:'收集新生对宿舍、食堂的投诉并跟进' },
          { key:'F', label:'协助各社团布置招新摊位，维持秩序' }
        ]
      },
      {
        text: '如果你来策划一次校园活动，你最看重哪个环节？',
        options: [
          { key:'A', label:'活动的视觉设计、宣传物料和线上曝光' },
          { key:'B', label:'能否邀请到知名嘉宾或拉到充足赞助' },
          { key:'C', label:'内容是否有深度，能否启发同学思考' },
          { key:'D', label:'活动的趣味性和现场互动氛围' },
          { key:'E', label:'活动后能否收集有效反馈以改进后续' },
          { key:'F', label:'能否让多个社团联合参与，扩大影响力' }
        ]
      },
      {
        text: '你更享受在团队中扮演哪种角色？',
        options: [
          { key:'A', label:'用创意和设计吸引大家关注' },
          { key:'B', label:'对外洽谈合作，争取资源' },
          { key:'C', label:'提供知识内容，担任主讲或策划学术环节' },
          { key:'D', label:'现场指挥调度，处理突发状况' },
          { key:'E', label:'倾听成员意见，协调团队内部关系' },
          { key:'F', label:'联络各社团代表，整合多方需求' }
        ]
      },
      {
        text: '你更愿意为同学们提供哪种帮助？',
        options: [
          { key:'A', label:'制作校园生活攻略、精美推送或短视频' },
          { key:'B', label:'争取校外商家优惠福利，发放学生专属折扣' },
          { key:'C', label:'举办考研/留学/实习经验分享会' },
          { key:'D', label:'组织一场欢乐的游园会或体育赛事' },
          { key:'E', label:'反馈食堂菜品、教室设施等日常问题' },
          { key:'F', label:'指导新社团成立，协助社团审批场地' }
        ]
      },
      {
        text: '下面哪项任务最让你有成就感？',
        options: [
          { key:'A', label:'自己设计的主视觉被全场活动使用' },
          { key:'B', label:'成功拉到一笔大额赞助，解决经费难题' },
          { key:'C', label:'讲座结束后收到同学真诚的感谢' },
          { key:'D', label:'看到自己策划的活动现场座无虚席、反响热烈' },
          { key:'E', label:'解决了困扰同学们已久的某项生活设施问题' },
          { key:'F', label:'帮助一个初创社团从无到有、顺利运转' }
        ]
      }
    ];

    /* ========== 默认头像（3:4 占位 SVG） ========== */
    var DEFAULT_PHOTO = 'data:image/svg+xml;utf8,' + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="300" height="400" viewBox="0 0 300 400">' +
      '<rect width="100%" height="100%" fill="#fff"/>' +
      '<rect x="10" y="10" width="280" height="380" rx="18" fill="none" stroke="#000" stroke-width="4"/>' +
      '<circle cx="150" cy="140" r="60" fill="#bbb"/>' +
      '<rect x="60" y="220" width="180" height="120" rx="24" fill="#bbb"/>' +
      '</svg>'
    );

    /* ========== 状态 ========== */
    var currentQ = 0;
    var answers = {};
    var matchedDept = null;
    var photoData = null;
    var userName = '';

    /* ========== DOM ========== */
    var $quizPage   = document.getElementById('quizPage');
    var $resultPage = document.getElementById('resultPage');
    var $badgePage  = document.getElementById('badgePage');
    var $qText      = document.getElementById('qText');
    var $optionsList= document.getElementById('optionsList');
    var $prevBtn    = document.getElementById('prevBtn');
    var $nextBtn    = document.getElementById('nextBtn');
    var $progressBar= document.getElementById('progressBar');
    var $quizProgress = document.getElementById('quizProgress');
    var $toast      = document.getElementById('toast');

    /* ========== Toast ========== */
    var toastTimer = null;
    function showToast(msg){
      if(toastTimer) clearTimeout(toastTimer);
      $toast.textContent = msg;
      $toast.classList.add('show');
      toastTimer = setTimeout(function(){ $toast.classList.remove('show'); }, 2000);
    }

    /* ========== 等比缩放 ========== */
    function fitStage(){
      document.querySelectorAll('.stage').forEach(function(stage){
        var scene = stage.querySelector('.scene');
        if(!scene) return;
        stage.style.setProperty('--scale', 1);
        var rect = scene.getBoundingClientRect();
        var vh = window.innerHeight;
        var rMin = 9/21;
        var s = (vh / rect.height) * (rMin * rect.height / rect.width) * 0.98;
        stage.style.setProperty('--scale', Math.min(s, 1));
      });
    }
    window.addEventListener('load', fitStage);
    window.addEventListener('resize', fitStage, { passive:true });

    /* ========== 渲染题目 ========== */
    function renderQuestion(){
      var q = QUESTIONS[currentQ];
      $qText.textContent = q.text;
      $quizProgress.textContent = '第 ' + (currentQ+1) + ' / 5 题';
      $progressBar.style.width = (currentQ/5*100) + '%';
      $nextBtn.disabled = true;
      $nextBtn.textContent = currentQ === 4 ? '查看结果' : '下一题';
      $prevBtn.style.display = currentQ === 0 ? 'none' : '';

      var html = '';
      q.options.forEach(function(opt){
        var sel = answers[currentQ] === opt.key ? ' selected' : '';
        html += '<div class="opt' + sel + '" data-key="' + opt.key + '" onclick="selectOption(this,\'' + opt.key + '\')">'
          + '<span class="opt-letter">' + opt.key + '</span>'
          + '<span class="opt-label">' + opt.label + '</span>'
          + '</div>';
      });
      $optionsList.innerHTML = html;
      if(answers[currentQ]) $nextBtn.disabled = false;
    }

    function selectOption(el, key){
      answers[currentQ] = key;
      var cards = $optionsList.querySelectorAll('.opt');
      for(var i=0;i<cards.length;i++) cards[i].classList.remove('selected');
      el.classList.add('selected');
      $nextBtn.disabled = false;
    }

    function nextQuestion(){
      if(currentQ < 4){
        currentQ++;
        renderQuestion();
        fitStage();
      } else {
        calculateResult();
        showResultPage();
      }
    }

    function prevQuestion(){
      if(currentQ > 0){
        currentQ--;
        renderQuestion();
        fitStage();
        window.scrollTo({ top:0, behavior:'smooth' });
      }
    }

    /* ========== 计算结果（含并列随机选） ========== */
    function calculateResult(){
      var tally = { A:0, B:0, C:0, D:0, E:0, F:0 };
      for(var i=0; i<5; i++){
        var ans = answers[i];
        if(ans && tally[ans] !== undefined) tally[ans]++;
      }
      // 找最高分
      var maxVal = 0;
      ['A','B','C','D','E','F'].forEach(function(k){
        if(tally[k] > maxVal) maxVal = tally[k];
      });
      // 收集所有最高分部门
      var winners = [];
      ['A','B','C','D','E','F'].forEach(function(k){
        if(tally[k] === maxVal) winners.push(k);
      });
      // 并列时随机选一个
      matchedDept = winners[Math.floor(Math.random() * winners.length)];
    }

    function showResultPage(){
      var dept = DEPT_MAP[matchedDept];
      document.getElementById('deptIcon').textContent = dept.icon;
      document.getElementById('deptName').textContent = dept.name;
      document.getElementById('deptDesc').textContent = dept.desc;
      switchPage('resultPage');
      fitStage();
      window.scrollTo({ top:0, behavior:'smooth' });
    }

    function goToQuiz(){
      switchPage('quizPage');
      fitStage();
      window.scrollTo({ top:0, behavior:'smooth' });
    }

    function goToResult(){
      switchPage('resultPage');
      fitStage();
      window.scrollTo({ top:0, behavior:'smooth' });
    }

    /* ========== 生成工作证 ========== */
    function generateBadge(){
      var nameVal = document.getElementById('nameInput').value.trim();
      if(!nameVal){ showToast('请输入姓名'); return; }
      userName = nameVal;

      document.getElementById('badgePhoto').src = photoData || DEFAULT_PHOTO;
      document.getElementById('badgeName').textContent = userName;
      document.getElementById('badgeDept').textContent = DEPT_MAP[matchedDept].name;

      switchPage('badgePage');
      fitStage();
      window.scrollTo({ top:0, behavior:'smooth' });
      showToast('工作证已生成！');
    }

    /* ========== 页面切换 ========== */
    function switchPage(pageId){
      [$quizPage, $resultPage, $badgePage].forEach(function(p){ p.classList.remove('active'); });
      document.getElementById(pageId).classList.add('active');
    }

    /* ========== 照片上传 ========== */
    var photoInput  = document.getElementById('photoInput');
    var photoPreview = document.getElementById('photoPreview');
    photoPreview.src = DEFAULT_PHOTO;

    photoInput.addEventListener('change', function(){
      var file = this.files && this.files[0];
      if(!file) return;
      if(file.size > 5*1024*1024){
        showToast('图片大于 5MB，请重新选择');
        this.value = '';
        return;
      }
      var reader = new FileReader();
      reader.onload = function(){ photoData = reader.result; photoPreview.src = reader.result; };
      reader.readAsDataURL(file);
    });

    /* ========== 保存为图片 ========== */
    function downloadBadge(){
      var card = document.getElementById('badgeCard');
      var btns = $badgePage.querySelector('.action-row');
      if(btns) btns.style.visibility = 'hidden';

      try{
        var w = card.offsetWidth, h = card.offsetHeight;
        var clone = card.cloneNode(true);
        clone.style.position = 'fixed';
        clone.style.top = '0'; clone.style.left = '0';
        clone.style.width = w + 'px';
        clone.style.zIndex = '-9999';
        clone.style.transform = 'none';
        document.body.appendChild(clone);

        var svgStr = '<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'">'
          + '<foreignObject width="100%" height="100%">'
          + '<div xmlns="http://www.w3.org/1999/xhtml">' + clone.outerHTML + '</div></foreignObject></svg>';
        document.body.removeChild(clone);

        var canvas = document.createElement('canvas');
        canvas.width = w*2; canvas.height = h*2;
        var ctx = canvas.getContext('2d');
        ctx.scale(2,2);

        var img = new Image();
        var svgBlob = new Blob([svgStr], { type:'image/svg+xml;charset=utf-8' });
        var url = URL.createObjectURL(svgBlob);

        img.onload = function(){
          ctx.drawImage(img, 0, 0, w, h);
          URL.revokeObjectURL(url);
          var link = document.createElement('a');
          link.download = 'CUHKSZ_工作证_' + (userName || 'card') + '.png';
          link.href = canvas.toDataURL('image/png');
          link.click();
          if(btns) btns.style.visibility = '';
          showToast('工作证已保存！');
        };
        img.onerror = function(){
          URL.revokeObjectURL(url);
          if(btns) btns.style.visibility = '';
          showToast('保存失败，请截图保存');
        };
        img.src = url;
      }catch(err){
        if(btns) btns.style.visibility = '';
        showToast('当前浏览器不支持，请截图保存');
      }
    }

    /* ========== 快捷键 ========== */
    document.addEventListener('keydown', function(e){
      if(e.key === 'Escape'){
        if($badgePage.classList.contains('active')) goToResult();
        else if($resultPage.classList.contains('active')) goToQuiz();
      }
    });

    /* ========== 初始化 ========== */
    renderQuestion();
  </script>
</body>
</html>
